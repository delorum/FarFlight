name: Web release / GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mv "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          chmod +x "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/export-templates"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp "$RUNNER_TEMP/export-templates/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Import project
        run: godot --headless --editor --path . --import
      - name: Regression tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/*_test.gd; do
            godot --headless --path . --script "res://$test" --quit-after 600 2>&1 | tee "$RUNNER_TEMP/test.log"
            if grep -Eq 'SCRIPT ERROR:|ERROR:|Parse Error' "$RUNNER_TEMP/test.log"; then exit 1; fi
          done
      - name: Export Web release
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          touch build/web/.nojekyll
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser smoke test (including save after reload)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/browser-test" --ignore-scripts playwright@1.63.0
          "$RUNNER_TEMP/browser-test/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web &
          web_server_pid=$!
          trap 'kill "$web_server_pid"' EXIT
          NODE_PATH="$RUNNER_TEMP/browser-test/node_modules" node tests/web_smoke.cjs
      - name: Upload downloadable Web release
        uses: actions/upload-artifact@v4
        with:
          name: FarFlight-Web
          path: build/web/
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Web release
        id: deployment
        uses: actions/deploy-pages@v4
